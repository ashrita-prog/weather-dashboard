<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weather Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root {
  --bg: #eef2f4;
  --surface: #ffffff;
  --surface-2: #e3eaee;
  --fg: #12222b;
  --muted: #5a6c76;
  --line: #cfd9df;
  --accent: #0b6e8a;
  --accent-fg: #ffffff;
  --warn: #8a5a00;
  --warn-bg: #fff2d6;
  --bad: #9b1c1c;
  --bad-bg: #fde4e4;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c171d; --surface: #13232c; --surface-2: #1a303b; --fg: #e6eff3; --muted: #8fa5b0;
    --line: #26404d; --accent: #4cc3e3; --accent-fg: #06222c;
    --warn: #f2c46b; --warn-bg: #3a2c0f; --bad: #ff9b9b; --bad-bg: #3b1616;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c171d; --surface: #13232c; --surface-2: #1a303b; --fg: #e6eff3; --muted: #8fa5b0;
  --line: #26404d; --accent: #4cc3e3; --accent-fg: #06222c;
  --warn: #f2c46b; --warn-bg: #3a2c0f; --bad: #ff9b9b; --bad-bg: #3b1616;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--font-body);
  padding-inline: 16px; padding-block: 24px 48px;
}
.wrap { max-width: 880px; margin-inline: auto; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { font: 700 1.35rem/1.2 var(--font-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 0.85rem; margin: 2px 0 0; }
.units { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.units button { border: 0; background: transparent; color: var(--muted); padding: 7px 14px; font: 500 0.85rem var(--font-data); cursor: pointer; }
.units button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
form { display: flex; flex-wrap: wrap; gap: 8px; }
form .field { flex: 1 1 240px; min-width: 0; position: relative; }
input[type="search"] {
  width: 100%; padding: 11px 14px; font: inherit; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px;
}
button.btn {
  padding: 11px 16px; font: 500 0.9rem var(--font-body); border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
button.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.55; cursor: progress; }
.results { position: absolute; inset-inline: 0; top: calc(100% + 4px); z-index: 5; margin: 0; padding: 4px; list-style: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
.results button { width: 100%; text-align: left; border: 0; background: transparent; color: var(--fg); padding: 9px 10px; border-radius: 6px; font: inherit; cursor: pointer; }
.results button:hover, .results button:focus-visible { background: var(--surface-2); }
.results small { color: var(--muted); }

.banner { display: none; padding: 12px 14px; border-radius: 8px; font-size: 0.9rem; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.show { display: flex; }
.banner.error { background: var(--bad-bg); color: var(--bad); }
.banner.info { background: var(--warn-bg); color: var(--warn); }
.banner .msg { min-width: 0; flex: 1 1 260px; }
.banner button { font: 500 0.85rem var(--font-body); padding: 6px 12px; border-radius: 6px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }

.now { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px;
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.now .place { font: 500 0.8rem var(--font-data); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
.now .temp { font: 700 clamp(3.6rem, 14vw, 6rem)/1 var(--font-display); letter-spacing: -0.04em; margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
.now .temp sup { font-size: 0.4em; font-weight: 500; color: var(--muted); letter-spacing: 0; vertical-align: top; position: relative; top: 0.25em; }
.now .cond { font: 500 1.15rem var(--font-display); margin: 0; }
.now .feels { color: var(--muted); font-size: 0.9rem; margin: 2px 0 0; }
.now svg { width: clamp(84px, 22vw, 150px); height: auto; color: var(--accent); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.stat .label { font: 500 0.75rem var(--font-data); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; }
.stat .value { font: 700 1.9rem/1.1 var(--font-display); margin: 0; font-variant-numeric: tabular-nums; }
.stat .value small { font: 400 0.9rem var(--font-data); color: var(--muted); margin-left: 4px; }
.stat .note { color: var(--muted); font-size: 0.85rem; margin: 6px 0 0; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 10px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s ease; }
.compass { display: inline-block; transition: transform .4s ease; }

.forecast { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.forecast h2 { font: 500 0.75rem var(--font-data); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 12px; }
.days { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.day { text-align: center; padding: 10px 4px; border-radius: 8px; background: var(--surface-2); min-width: 0; }
.day .d { font: 500 0.8rem var(--font-data); color: var(--muted); }
.day svg { width: 34px; height: 34px; color: var(--accent); margin-block: 6px; }
.day .hi { font: 700 1rem var(--font-display); font-variant-numeric: tabular-nums; }
.day .lo { color: var(--muted); font: 400 0.85rem var(--font-data); font-variant-numeric: tabular-nums; }
@media (max-width: 520px) {
  .days { grid-template-columns: repeat(5, minmax(64px, 1fr)); overflow-x: auto; }
  .now { padding: 18px; }
}
.skeleton { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.foot { color: var(--muted); font-size: 0.8rem; }
.foot a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } .meter span, .compass { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Weather Dashboard</h1>
      <p class="sub" id="updated">Search for a city to see current conditions.</p>
    </div>
    <div class="units" role="group" aria-label="Units">
      <button type="button" id="u-c" aria-pressed="true">°C · km/h</button>
      <button type="button" id="u-f" aria-pressed="false">°F · mph</button>
    </div>
  </header>

  <form id="search" autocomplete="off">
    <div class="field">
      <input type="search" id="q" placeholder="Search a city, e.g. Hyderabad" aria-label="City name" maxlength="80">
      <ul class="results" id="results" hidden></ul>
    </div>
    <button class="btn primary" type="submit" id="go">Search</button>
    <button class="btn" type="button" id="locate">Use my location</button>
  </form>

  <div class="banner error" id="error" role="alert">
    <span class="msg" id="error-msg"></span>
    <span><button type="button" id="retry">Retry</button> <button type="button" id="demo">Load sample data</button></span>
  </div>
  <div class="banner info" id="info" role="status"><span class="msg" id="info-msg"></span></div>

  <section class="now" id="now" aria-live="polite" hidden>
    <div>
      <p class="place" id="place"></p>
      <p class="temp"><span id="temp">--</span><sup id="temp-unit">°C</sup></p>
      <p class="cond" id="cond"></p>
      <p class="feels" id="feels"></p>
    </div>
    <div id="icon" aria-hidden="true"></div>
  </section>

  <section class="stats" id="stats" hidden>
    <div class="stat">
      <p class="label">Humidity</p>
      <p class="value"><span id="hum">--</span><small>%</small></p>
      <div class="meter" role="presentation"><span id="hum-bar" style="width:0"></span></div>
      <p class="note" id="hum-note"></p>
    </div>
    <div class="stat">
      <p class="label">Wind speed</p>
      <p class="value"><span id="wind">--</span><small id="wind-unit">km/h</small></p>
      <p class="note"><span class="compass" id="compass">↑</span> <span id="wind-dir"></span></p>
    </div>
    <div class="stat">
      <p class="label">Feels like</p>
      <p class="value"><span id="app">--</span><small id="app-unit">°C</small></p>
      <p class="note" id="app-note"></p>
    </div>
  </section>

  <section class="forecast" id="forecast" hidden>
    <h2>Next 5 days</h2>
    <div class="days" id="days"></div>
  </section>

  <p class="foot">Data from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>. No API key needed.</p>
</div>

<script>
"use strict";

const GEO_URL = "https://geocoding-api.open-meteo.com/v1/search";
const WX_URL  = "https://api.open-meteo.com/v1/forecast";
const TIMEOUT_MS = 10000;

const CODES = {
  0: ["Clear sky", "sun"], 1: ["Mainly clear", "sun"], 2: ["Partly cloudy", "partly"], 3: ["Overcast", "cloud"],
  45: ["Fog", "fog"], 48: ["Rime fog", "fog"],
  51: ["Light drizzle", "rain"], 53: ["Drizzle", "rain"], 55: ["Heavy drizzle", "rain"],
  56: ["Freezing drizzle", "rain"], 57: ["Freezing drizzle", "rain"],
  61: ["Light rain", "rain"], 63: ["Rain", "rain"], 65: ["Heavy rain", "rain"],
  66: ["Freezing rain", "rain"], 67: ["Freezing rain", "rain"],
  71: ["Light snow", "snow"], 73: ["Snow", "snow"], 75: ["Heavy snow", "snow"], 77: ["Snow grains", "snow"],
  80: ["Rain showers", "rain"], 81: ["Rain showers", "rain"], 82: ["Violent showers", "rain"],
  85: ["Snow showers", "snow"], 86: ["Snow showers", "snow"],
  95: ["Thunderstorm", "storm"], 96: ["Thunderstorm, hail", "storm"], 99: ["Thunderstorm, hail", "storm"]
};
const describe = (c) => CODES[c] || ["Unknown conditions", "cloud"];

const $ = (id) => document.getElementById(id);
const state = { place: null, units: "metric", lastData: null };

function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
function load(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }

class ApiError extends Error {
  constructor(message, kind) { super(message); this.kind = kind; }
}

async function getJSON(url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  let res;
  try {
    res = await fetch(url, { signal: ctrl.signal });
  } catch (err) {
    if (err.name === "AbortError") throw new ApiError("The weather service took too long to respond.", "timeout");
    throw new ApiError("Could not reach the weather service. Check your internet connection.", "network");
  } finally {
    clearTimeout(timer);
  }
  if (res.status === 429) throw new ApiError("Too many requests. Wait a minute and try again.", "rate");
  if (!res.ok) throw new ApiError("The weather service returned an error (" + res.status + ").", "http");
  try {
    return await res.json();
  } catch (e) {
    throw new ApiError("The weather service sent a response this app could not read.", "parse");
  }
}

async function searchCities(name) {
  const url = GEO_URL + "?name=" + encodeURIComponent(name) + "&count=5&language=en&format=json";
  const data = await getJSON(url);
  return Array.isArray(data.results) ? data.results : [];
}

async function fetchWeather(place, units) {
  const imperial = units === "imperial";
  const params = new URLSearchParams({
    latitude: place.latitude,
    longitude: place.longitude,
    current: "temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,wind_direction_10m,weather_code,is_day",
    daily: "weather_code,temperature_2m_max,temperature_2m_min",
    forecast_days: 5,
    timezone: "auto",
    temperature_unit: imperial ? "fahrenheit" : "celsius",
    wind_speed_unit: imperial ? "mph" : "kmh"
  });
  const data = await getJSON(WX_URL + "?" + params);
  if (!data || !data.current || !data.daily) throw new ApiError("The weather data was incomplete.", "parse");
  return data;
}

function icon(kind) {
  const cloud = '<path d="M17 38h26a9 9 0 0 0 .9-17.96A12 12 0 0 0 21 23.5 7.5 7.5 0 0 0 17 38z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>';
  const sun = '<circle cx="32" cy="32" r="9" fill="currentColor"/><g stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M32 12v6M32 46v6M12 32h6M46 32h6M18 18l4 4M42 42l4 4M18 46l4-4M42 22l4-4"/></g>';
  const bits = {
    sun: sun,
    partly: '<g transform="translate(-8,-8) scale(.7)">' + sun + '</g><g transform="translate(6,8)">' + cloud + '</g>',
    cloud: '<g transform="translate(0,4)">' + cloud + '</g>',
    fog: cloud + '<g stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M16 46h32M22 53h22"/></g>',
    rain: cloud + '<g stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M22 45l-3 7M32 45l-3 7M42 45l-3 7"/></g>',
    snow: cloud + '<g fill="currentColor"><circle cx="22" cy="49" r="2.5"/><circle cx="32" cy="52" r="2.5"/><circle cx="42" cy="49" r="2.5"/></g>',
    storm: cloud + '<path d="M33 40l-6 9h6l-3 8 9-11h-6l3-6z" fill="currentColor"/>'
  };
  return '<svg viewBox="0 0 64 64" role="img" aria-label="' + kind + '">' + (bits[kind] || bits.cloud) + '</svg>';
}

const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compassName = (deg) => COMPASS[Math.round(((deg % 360) / 22.5)) % 16];

function humidityNote(h) {
  if (h < 30) return "Dry air";
  if (h < 60) return "Comfortable";
  if (h < 80) return "Humid";
  return "Very humid";
}
function windNote(speedKmh) {
  if (speedKmh < 1) return "Calm";
  if (speedKmh < 12) return "Light breeze";
  if (speedKmh < 29) return "Moderate breeze";
  if (speedKmh < 50) return "Strong wind";
  return "Gale force";
}

function render(data, place, units) {
  const imperial = units === "imperial";
  const t = imperial ? "°F" : "°C";
  const c = data.current;
  const [label, kind] = describe(c.weather_code);
  const speedKmh = imperial ? c.wind_speed_10m * 1.609 : c.wind_speed_10m;

  $("place").textContent = [place.name, place.admin1, place.country].filter(Boolean).join(", ");
  $("temp").textContent = Math.round(c.temperature_2m);
  $("temp-unit").textContent = t;
  $("cond").textContent = label + (c.is_day ? "" : " · night");
  $("feels").textContent = "Feels like " + Math.round(c.apparent_temperature) + t;
  $("icon").innerHTML = icon(kind);

  $("hum").textContent = Math.round(c.relative_humidity_2m);
  $("hum-bar").style.width = Math.max(0, Math.min(100, c.relative_humidity_2m)) + "%";
  $("hum-note").textContent = humidityNote(c.relative_humidity_2m);

  $("wind").textContent = Math.round(c.wind_speed_10m);
  $("wind-unit").textContent = imperial ? "mph" : "km/h";
  $("compass").style.transform = "rotate(" + (c.wind_direction_10m + 180) + "deg)";
  $("wind-dir").textContent = windNote(speedKmh) + " from the " + compassName(c.wind_direction_10m);

  $("app").textContent = Math.round(c.apparent_temperature);
  $("app-unit").textContent = t;
  const diff = Math.round(c.apparent_temperature - c.temperature_2m);
  $("app-note").textContent = diff === 0 ? "Same as the air temperature" : Math.abs(diff) + t + (diff > 0 ? " warmer" : " cooler") + " than the air temperature";

  const days = data.daily;
  $("days").innerHTML = days.time.map((iso, i) => {
    const d = new Date(iso + "T12:00:00");
    const name = i === 0 ? "Today" : d.toLocaleDateString(undefined, { weekday: "short" });
    return '<div class="day"><div class="d">' + name + "</div>" + icon(describe(days.weather_code[i])[1]) +
      '<div class="hi">' + Math.round(days.temperature_2m_max[i]) + '°</div>' +
      '<div class="lo">' + Math.round(days.temperature_2m_min[i]) + '°</div></div>';
  }).join("");

  const when = new Date(c.time);
  $("updated").textContent = "Updated " + when.toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" }) + " local time";
  ["now", "stats", "forecast"].forEach((id) => { $(id).hidden = false; $(id).classList.remove("skeleton"); });
}

function showError(msg) { $("error-msg").textContent = msg; $("error").classList.add("show"); }
function clearError() { $("error").classList.remove("show"); }
function showInfo(msg) { $("info-msg").textContent = msg; $("info").classList.add("show"); }
function clearInfo() { $("info").classList.remove("show"); }
function setBusy(b) {
  $("go").disabled = b; $("locate").disabled = b;
  ["now", "stats", "forecast"].forEach((id) => $(id).classList.toggle("skeleton", b && !$(id).hidden));
}

async function showWeather(place) {
  state.place = place;
  clearError(); clearInfo(); setBusy(true);
  try {
    const data = await fetchWeather(place, state.units);
    state.lastData = data;
    render(data, place, state.units);
    store("wx.place", place);
  } catch (err) {
    showError(err instanceof ApiError ? err.message : "Something unexpected went wrong. Please try again.");
  } finally {
    setBusy(false);
  }
}

async function onSearch(e) {
  e.preventDefault();
  const name = $("q").value.trim();
  hideResults();
  if (name.length < 2) { showError("Enter at least 2 characters of a city name."); return; }
  clearError(); clearInfo(); setBusy(true);
  try {
    const found = await searchCities(name);
    if (found.length === 0) { showError('No city found for "' + name + '". Check the spelling or try a nearby larger city.'); return; }
    if (found.length === 1) { setBusy(false); await showWeather(found[0]); return; }
    showResults(found);
  } catch (err) {
    showError(err instanceof ApiError ? err.message : "Search failed. Please try again.");
  } finally {
    setBusy(false);
  }
}

function showResults(list) {
  const ul = $("results");
  ul.innerHTML = "";
  list.forEach((p) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = "";
    b.append(p.name + " ");
    const s = document.createElement("small");
    s.textContent = [p.admin1, p.country].filter(Boolean).join(", ");
    b.append(s);
    b.addEventListener("click", () => { hideResults(); $("q").value = p.name; showWeather(p); });
    li.append(b);
    ul.append(li);
  });
  ul.hidden = false;
}
function hideResults() { $("results").hidden = true; }

function onLocate() {
  if (!("geolocation" in navigator)) { showError("This browser does not support location. Search for a city instead."); return; }
  clearError(); clearInfo(); setBusy(true);
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      setBusy(false);
      showWeather({ name: "Your location", latitude: pos.coords.latitude, longitude: pos.coords.longitude });
    },
    (err) => {
      setBusy(false);
      const msgs = {
        1: "Location permission was denied. Allow location access or search for a city.",
        2: "Your position could not be determined. Search for a city instead.",
        3: "Finding your location timed out. Try again or search for a city."
      };
      showError(msgs[err.code] || "Could not get your location.");
    },
    { timeout: 10000, maximumAge: 300000 }
  );
}

function setUnits(u) {
  state.units = u;
  $("u-c").setAttribute("aria-pressed", String(u === "metric"));
  $("u-f").setAttribute("aria-pressed", String(u === "imperial"));
  store("wx.units", u);
  if (state.place && !$("now").hidden) showWeather(state.place);
}

function loadDemo() {
  const imperial = state.units === "imperial";
  const f = (c) => imperial ? c * 9 / 5 + 32 : c;
  const base = new Date(); base.setMinutes(0, 0, 0);
  const days = [0, 1, 2, 3, 4].map((i) => { const d = new Date(Date.now() + i * 864e5); return d.toISOString().slice(0, 10); });
  const data = {
    current: { time: base.toISOString().slice(0, 16), temperature_2m: f(31.4), apparent_temperature: f(36.2), relative_humidity_2m: 71,
      wind_speed_10m: imperial ? 9 : 14, wind_direction_10m: 235, weather_code: 2, is_day: 1 },
    daily: { time: days, weather_code: [2, 61, 80, 1, 0],
      temperature_2m_max: [32, 30, 29, 33, 34].map(f), temperature_2m_min: [25, 24, 24, 25, 26].map(f) }
  };
  state.place = { name: "Sample City", admin1: "Demo data", country: "" };
  clearError();
  render(data, state.place, state.units);
  showInfo("Showing sample data, not live weather. Fix the connection and search again for real conditions.");
}

$("search").addEventListener("submit", onSearch);
$("locate").addEventListener("click", onLocate);
$("u-c").addEventListener("click", () => setUnits("metric"));
$("u-f").addEventListener("click", () => setUnits("imperial"));
$("retry").addEventListener("click", () => { if (state.place) showWeather(state.place); else $("search").requestSubmit(); });
$("demo").addEventListener("click", loadDemo);
document.addEventListener("click", (e) => { if (!e.target.closest(".field")) hideResults(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideResults(); });

(function init() {
  const u = load("wx.units");
  if (u === "imperial") { state.units = "imperial"; $("u-c").setAttribute("aria-pressed", "false"); $("u-f").setAttribute("aria-pressed", "true"); }
  const saved = load("wx.place");
  showWeather(saved && saved.latitude != null ? saved : { name: "Hyderabad", admin1: "Telangana", country: "India", latitude: 17.385, longitude: 78.4867 });
})();
</script>
</body>
</html>
